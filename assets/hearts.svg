<svg xmlns="http://www.w3.org/2000/svg" width="360" height="48" viewBox="0 0 360 48" shape-rendering="crispEdges" role="img" aria-label="row of hopping pixel hearts"><style>
g.tw,g.fl,g.bob,g.hop{transform-box:fill-box;transform-origin:center}
.tw{animation:tw 2.6s ease-in-out infinite both}
.fl{animation:fl 4.2s ease-in-out infinite both;opacity:0}
.bob{animation:bob 3s ease-in-out infinite}
.hop{animation:hop 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.35)}50%{opacity:1;transform:scale(1)}}
@keyframes fl{0%{opacity:0;transform:translateY(6px)}30%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.tw,.fl,.bob,.hop{animation:none;opacity:1}}
